# בנייה אוטומטית: בכל דחיפה — בדיקות ובנייה ל-Windows, מק ולינוקס; בכל תגית v* — גרסה חדשה ב-Releases (והאפליקציות המותקנות מתעדכנות לבד)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# כל הפעולות בגרסאות שרצות על node 24 (בלי אזהרת ״node 20 יוצא משימוש״).
# אובונטו נעול על 24.04: ubuntu-latest עובר לאובונטו 26 — מעבר בכוונה, אחרי בדיקה, לא בהפתעה.

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: בנייה
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: התקנת כלים
        run: |
          cd test && npm install && npx playwright install --with-deps chromium
          cd ../app && npm ci
      - name: בדיקות — הסימולטור בדפדפן
        run: |
          cd test && ./mk.sh
          (python3 -m http.server 8899 >/dev/null 2>&1 &)
          sleep 1
          for t in smoke name_test ui_test play_test hud_test backup_test stop_test split_test mag_test v52_test v56_test v57_test v58_test kb_test pathlib_test p2_test p3_test; do node $t.mjs; done
      - name: בדיקות — האפליקציה
        env:
          BB_TEST_EMAIL: ${{ secrets.BB_TEST_EMAIL }}
          BB_TEST_EMAIL2: ${{ secrets.BB_TEST_EMAIL2 }}
          BB_TEST_PASS: ${{ secrets.BB_TEST_PASS }}
        run: |
          cd test
          timeout 120 node bridge_test.mjs
          timeout 300 node sync_test.mjs
          timeout 600 xvfb-run -a node app_test.mjs
          timeout 600 xvfb-run -a node app_cloud_test.mjs
          timeout 600 xvfb-run -a node app_p2_test.mjs
          timeout 600 xvfb-run -a node app_shell_test.mjs
          timeout 600 xvfb-run -a node app_v56_test.mjs

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: בנייה
        shell: bash
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: גרסה מהתגית
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cd app && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: EXE
        shell: bash
        run: cd app && npm ci && npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: BIOBUZZ-windows
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml

  mac:
    needs: test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: בנייה
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: גרסה מהתגית
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd app && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: DMG — אפל סיליקון ואינטל (חתימה מקומית בלבד, בלי אישור אפל)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: cd app && npm ci && npx electron-builder --mac dmg --arm64 --x64 --publish never
      - name: בדיקה — האפליקציה נפתחת במק
        run: |
          APP="$(ls -d app/release/mac-arm64/*.app | head -1)"
          codesign --verify --deep "$APP" && echo "חתימה מקומית תקינה"
          ( BIOBUZZ_TEST=1 BIOBUZZ_NOADB=1 "$APP/Contents/MacOS/BIOBUZZ" & echo $! > pid ); sleep 25
          kill -0 "$(cat pid)" && echo "רץ 25 שניות בלי לקרוס" && kill "$(cat pid)"
      - uses: actions/upload-artifact@v6
        with:
          name: BIOBUZZ-mac
          path: |
            app/release/*.dmg
            app/release/*.blockmap

  linux:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: בנייה
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: גרסה מהתגית
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd app && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: AppImage ו-deb
        run: cd app && npm ci && npx electron-builder --linux AppImage deb --x64 --publish never
      - name: בדיקה — האפליקציה הארוזה עולה
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: |
          cd test && npm install && npx playwright install --with-deps chromium
          timeout 400 xvfb-run -a node linux_pkg_test.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: BIOBUZZ-linux
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/latest-linux.yml

  # בתגית v* — גרסה אחת ב-Releases עם כל הקבצים של שלוש המערכות
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
