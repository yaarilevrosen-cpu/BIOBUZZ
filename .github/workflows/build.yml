# בנייה אוטומטית: בכל דחיפה — בדיקות ו-EXE; בכל תגית v* — גרסה חדשה ב-Releases (והאפליקציות המותקנות מתעדכנות לבד)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: בנייה
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: התקנת כלים
        run: |
          cd test && npm install && npx playwright install --with-deps chromium
          cd ../app && npm ci
      - name: בדיקות — הסימולטור בדפדפן
        run: |
          cd test && ./mk.sh
          (python3 -m http.server 8899 >/dev/null 2>&1 &)
          sleep 1
          for t in smoke ui_test play_test hud_test backup_test stop_test split_test mag_test v52_test kb_test pathlib_test p2_test p3_test; do node $t.mjs; done
      - name: בדיקות — האפליקציה
        env:
          BB_TEST_EMAIL: ${{ secrets.BB_TEST_EMAIL }}
          BB_TEST_EMAIL2: ${{ secrets.BB_TEST_EMAIL2 }}
          BB_TEST_PASS: ${{ secrets.BB_TEST_PASS }}
        run: |
          cd test
          timeout 120 node bridge_test.mjs
          timeout 300 node sync_test.mjs
          timeout 600 xvfb-run -a node app_test.mjs
          timeout 600 xvfb-run -a node app_cloud_test.mjs
          timeout 600 xvfb-run -a node app_p2_test.mjs
          timeout 600 xvfb-run -a node app_shell_test.mjs

  windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: בנייה
        shell: bash
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: גרסה מהתגית
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cd app && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: EXE (ובתגית — פרסום ל-Releases)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd app && npm ci
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then PUB=always; else PUB=never; fi
          npx electron-builder --win nsis portable --x64 --publish $PUB
      - uses: actions/upload-artifact@v4
        with:
          name: BIOBUZZ-windows
          path: |
            app/release/*.exe
            app/release/latest.yml
