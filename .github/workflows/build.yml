# בנייה אוטומטית: בכל דחיפה — בדיקות ובנייה ל-Windows, מק ולינוקס; בכל תגית v* — גרסה חדשה ב-Releases (והאפליקציות המותקנות מתעדכנות לבד)
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# הרשאות מינימליות: קריאה בלבד. רק שלב ה-Release (בתגית) מקבל כתיבה.
permissions:
  contents: read

# ריצה אחת לכל ענף/PR: דחיפה חדשה מבטלת את הקודמת. בתגית v* — אף פעם לא מבטלים (גרסה חצי-משוחררת).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# כל הפעולות בגרסאות שרצות על node 24 (בלי אזהרת ״node 20 יוצא משימוש״).
# הפעולות של GitHub עצמה (actions/*) על תגית ראשית; פעולות של צד שלישי נעולות ל-SHA מלא (עם הגרסה בהערה).
# המכונות נעולות לגרסה: ubuntu-24.04, windows-2025, macos-15 (אפל סיליקון).
# ה-latest זז לבד (ubuntu-latest עובר לאובונטו 26 וכו׳) — מעבר עושים בכוונה, אחרי בדיקה, לא בהפתעה.

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: בנייה
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: התקנת כלים
        run: |
          cd test && npm ci && npx playwright install --with-deps chromium
          cd ../app && npm ci
      - name: בדיקות — הסימולטור בדפדפן
        run: |
          cd test && ./mk.sh
          (python3 -m http.server 8899 >/dev/null 2>&1 &)
          # מחכים שהשרת יענה (עד 20 שניות), במקום ״sleep 1״ ולקוות
          for i in $(seq 1 40); do curl -sf -o /dev/null http://127.0.0.1:8899/sim.html && break; sleep 0.5; done
          curl -sf -o /dev/null http://127.0.0.1:8899/sim.html || { echo "::error::the static test server did not answer within 20 s"; exit 1; }
          # mp2_test מפעיל בעצמו את גשר הטלפון (python3 ../pad/padbridge.py --port 9662 --no-adb) ומכבה אותו בסוף.
          # dist_test בודק את dist/BIOBUZZ-lab.html המלא (ה-CAD ב-cad/*.json שמור בריפו, build.py מטמיע אותו).
          FAILED=""
          for t in smoke name_test v60_test v61_test ui_test play_test hud_test backup_test stop_test split_test mag_test v52_test v56_test v57_test v58_test kb_test pathlib_test p2_test p3_test \
                   auto_test brain_test g304_test regress_test review_test teach_test v42_test dist_test mp2_test \
                   v63_bld_test v63_core_test v63_ui_test v63_wiz_test v64_push_test v65_practice_test v66_test v68_test v69_test v70_drills_test v70_plan_test v70_ghost_test v70_board_test v70_cast_test v70_daily_test v70_redteam_test v71_fixes_test; do
            echo "::group::$t"
            if node $t.mjs > "/tmp/$t.log" 2>&1; then cat "/tmp/$t.log"; else
              rc=$?; cat "/tmp/$t.log"; FAILED="$FAILED $t"
              # הכישלון מופיע גם כהערה בדף הריצה (הלוג המלא דורש התחברות)
              grep -E "✗|Error|Timeout" "/tmp/$t.log" | head -8 | while IFS= read -r l; do echo "::error title=$t::${l//%/%25}"; done
              [ -s "/tmp/$t.log" ] || echo "::error title=$t::exit $rc, no output"
            fi
            echo "::endgroup::"
          done
          [ -z "$FAILED" ] || { echo "::error::failed:$FAILED"; exit 1; }
      - name: בדיקות — autosel (חניה ידועה כלא-יציבה — ניסיון חוזר אחד, גלוי)
        run: |
          cd test
          # ״ירי מקדים וחניה״ נכשל לפעמים (בערך 1 מ-3). לא מסתירים: אם זו הבדיקה היחידה שנכשלה — מנסים שוב פעם אחת
          # ומדפיסים אזהרה. כל כישלון אחר, או כישלון גם בניסיון השני — נכשל.
          set +e
          node autosel_test.mjs 2>&1 | tee autosel1.log; rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != 0 ]; then
            fails=$(sed -n '/^autosel_test: /,$p' autosel1.log | tail -n +2)
            if [ "$(printf '%s\n' "$fails" | grep -c .)" = 1 ] && printf '%s' "$fails" | grep -q '^ירי מקדים וחניה'; then
              echo "::warning title=autosel_test flaky::parking check failed on the first try, retrying once: $fails"
              node autosel_test.mjs
            else
              exit "$rc"
            fi
          fi
      - name: בדיקות — האפליקציה
        run: |
          cd test
          FAILED=""
          run(){ t=$1; shift; echo "::group::$t"
            if "$@" > "/tmp/$t.log" 2>&1; then cat "/tmp/$t.log"; else
              rc=$?; cat "/tmp/$t.log"; FAILED="$FAILED $t"
              grep -E "✗|Error|Timeout" "/tmp/$t.log" | head -8 | while IFS= read -r l; do echo "::error title=$t::${l//%/%25}"; done
              [ -s "/tmp/$t.log" ] || echo "::error title=$t::exit $rc, no output"
            fi; echo "::endgroup::"; }
          run bridge_test timeout 120 node bridge_test.mjs
          run sync_robust_test timeout 180 node sync_robust_test.mjs
          for t in app_test app_p2_test app_shell_test app_v56_test app_ai_test app_drag_test v63_app_test app_v63_wiz_test; do
            run $t timeout 600 xvfb-run -a node $t.mjs
          done
          [ -z "$FAILED" ] || { echo "::error::failed:$FAILED"; exit 1; }
      # סנכרון מול Supabase — שימו לב: זה פרויקט ה-Supabase של הייצור, עם חשבונות בדיקה ייעודיים.
      # לכן: לא רץ ב-PR ממזלג (אין שם סודות, וקוד זר לא נוגע בייצור).
      # מ-1.12.4 sync.js קורא BIOBUZZ_CLOUD_URL / BIOBUZZ_CLOUD_KEY — sync_robust_test כבר רץ מול שרת מדומה; פרויקט בדיקות נפרד אפשרי.
      - name: בדיקות — ענן (Supabase)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BB_TEST_EMAIL: ${{ secrets.BB_TEST_EMAIL }}
          BB_TEST_EMAIL2: ${{ secrets.BB_TEST_EMAIL2 }}
          BB_TEST_PASS: ${{ secrets.BB_TEST_PASS }}
        run: |
          cd test
          if [ -z "$BB_TEST_EMAIL" ] || [ -z "$BB_TEST_PASS" ]; then
            echo "::warning title=cloud tests skipped::BB_TEST_EMAIL / BB_TEST_PASS secrets are missing — sync_test and the sync part of app_cloud_test were NOT run"
          fi
          timeout 300 node sync_test.mjs
          # בלי סודות app_cloud_test עדיין בודק את העדכון האוטומטי (שרת מקומי), ומדלג על הסנכרון
          timeout 600 xvfb-run -a node app_cloud_test.mjs

  windows:
    needs: test
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: בנייה
        shell: bash
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: גרסה מהתגית
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: cd app && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: EXE
        shell: bash
        run: cd app && npm ci && npx electron-builder --win nsis portable --x64 --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: BIOBUZZ-windows
          path: |
            app/release/*.exe
            app/release/*.blockmap
            app/release/latest.yml

  mac:
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: בנייה
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: גרסה מהתגית
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd app && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: DMG — אפל סיליקון ואינטל (חתימה מקומית בלבד, בלי אישור אפל)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail   # בלי זה ״| tee״ מחזיר תמיד הצלחה
          cd app && npm ci
          # hdiutil במכונות של GitHub נכשל לפעמים (״Resource busy״ וכו׳) — עד 3 ניסיונות.
          # כשכל הניסיונות נכשלים: סוף הלוג מוצג כהערת שגיאה בראש הריצה, בלי לחפור בלוג.
          for i in 1 2 3; do
            if npx electron-builder --mac dmg --arm64 --x64 --publish never 2>&1 | tee "../dmg-$i.log"; then exit 0; fi
            echo "::warning title=DMG build::attempt $i/3 failed"
            rm -rf release/*.dmg release/*.blockmap
            [ "$i" = 3 ] || sleep 15
          done
          for i in 1 2 3; do
            msg=$(tr -d '\r' < "../dmg-$i.log" | grep -v '^[[:space:]]*$' | tail -n 25 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=DMG build failed (attempt $i/3)::$msg"
          done
          exit 1
      - name: בדיקה — האפליקציה נפתחת במק
        run: |
          APP="$(ls -d app/release/mac-arm64/*.app | head -1)"
          codesign --verify --deep "$APP" && echo "חתימה מקומית תקינה"
          ( BIOBUZZ_TEST=1 BIOBUZZ_NOADB=1 "$APP/Contents/MacOS/BIOBUZZ" & echo $! > pid ); sleep 25
          kill -0 "$(cat pid)" && echo "רץ 25 שניות בלי לקרוס" && kill "$(cat pid)"
      - uses: actions/upload-artifact@v6
        with:
          name: BIOBUZZ-mac
          path: |
            app/release/*.dmg
            app/release/*.blockmap

  linux:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 22 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - name: בנייה
        run: python build.py && mkdir -p app/sim && cp dist/BIOBUZZ-lab.html app/sim/index.html
      - name: גרסה מהתגית
        if: startsWith(github.ref, 'refs/tags/v')
        run: cd app && npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: AppImage ו-deb
        run: cd app && npm ci && npx electron-builder --linux AppImage deb --x64 --publish never
      # רץ גם בתגית: זו בדיקה של הקובץ שבאמת משתחרר (הגרסה ב-package.json עודכנה מהתגית, והבדיקה קוראת אותה משם)
      - name: בדיקה — האפליקציה הארוזה עולה
        run: |
          cd test && npm ci && npx playwright install --with-deps chromium
          timeout 400 xvfb-run -a node linux_pkg_test.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: BIOBUZZ-linux
          path: |
            app/release/*.AppImage
            app/release/*.deb
            app/release/latest-linux.yml

  # בתגית v* — גרסה אחת ב-Releases עם כל הקבצים של שלוש המערכות
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, mac, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/*
          generate_release_notes: true
