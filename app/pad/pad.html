<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0B0E12">
<title>שלט BIOBUZZ</title>
<style>
  :root{--bg:#0B0E12;--panel:#141A21;--panel2:#1C242D;--line:#28323D;--line2:#38434E;
    --ink:#E9EFF5;--ink2:#B9C6D2;--dim:#5C6B79;--accent:#FFB020;--good:#35D6A4;--red:#F2545B;--blue:#4C9AF5}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:system-ui,"Segoe UI",sans-serif;touch-action:none}
  #top{position:fixed;top:0;inset-inline:0;height:40px;display:flex;align-items:center;gap:10px;
    padding:0 12px;background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;z-index:5}
  #st{display:flex;align-items:center;gap:6px}
  #led{width:9px;height:9px;border-radius:50%;background:var(--red)}
  #led.ok{background:var(--good)}
  .chip{padding:2px 8px;border-radius:7px;border:1px solid var(--line2);color:var(--ink2)}
  .chip.on{border-color:var(--accent);color:var(--accent)}
  #sp{flex:1}
  #gear{background:none;border:1px solid var(--line2);color:var(--ink2);border-radius:8px;padding:4px 10px;font:inherit}
  .zone{position:fixed;top:40px;bottom:0;width:50%}
  #zL{left:0} #zR{right:0}
  .stick{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;
    border:2px solid var(--line2);background:rgba(28,36,45,.55);display:none;pointer-events:none}
  .stick i{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;
    border-radius:50%;background:var(--accent);opacity:.9}
  .hint{position:absolute;bottom:14px;width:100%;text-align:center;color:var(--dim);font-size:12px;pointer-events:none}
  .btns{position:fixed;z-index:3;display:flex;gap:10px}
  .b{width:62px;height:62px;border-radius:50%;border:2px solid var(--line2);background:var(--panel2);
    color:var(--ink);font:600 15px system-ui;display:flex;align-items:center;justify-content:center}
  .b.dn{background:var(--accent);color:#0B0E12;border-color:var(--accent)}
  .sh{width:92px;height:44px;border-radius:12px;font-size:13px}
  #fire{width:92px;height:92px;font-size:17px;border-color:var(--red)}
  #fire.dn{background:var(--red);color:#fff}
  #faces{right:18px;bottom:18px;flex-wrap:wrap;width:200px;justify-content:flex-end}
  #shL{left:18px;top:54px} #shR{right:18px;top:54px}
  #lt{position:fixed;left:18px;top:108px;width:44px;height:150px;border-radius:12px;border:2px solid var(--line2);
    background:var(--panel2);z-index:3;overflow:hidden}
  #lt i{position:absolute;bottom:0;left:0;right:0;height:0;background:var(--accent);opacity:.8}
  #lt span{position:absolute;top:6px;width:100%;text-align:center;font-size:11px;color:var(--ink2)}
  #set{position:fixed;inset:40px 0 0 0;background:rgba(11,14,18,.97);z-index:9;padding:16px;display:none;overflow:auto}
  #set.on{display:block}
  #set label{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;
    border-bottom:1px solid var(--line);font-size:14px}
  #set input[type=range]{width:50%}
  #rot{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;align-items:center;
    justify-content:center;text-align:center;font-size:18px;padding:30px}
  @media (orientation:portrait){ #rot{display:flex} }
</style></head><body>
<div id="top"><div id="st"><i id="led"></i><span id="stx">מתחבר…</span></div>
  <span class="chip" id="cMag">מחסנית 0</span><span class="chip" id="cIn">איסוף</span>
  <span class="chip" id="cFc">ציר רובוט</span><span id="sp"></span><span id="ping"></span>
  <button id="gear">הגדרות</button></div>
<div class="zone" id="zL"><div class="stick" id="sL"><i></i></div><div class="hint">נגיעה כאן — נסיעה</div></div>
<div class="zone" id="zR"><div class="stick" id="sR"><i></i></div><div class="hint">נגיעה כאן — סיבוב</div></div>
<div class="btns" id="shL"><button class="b sh" data-bit="4">איסוף</button></div>
<div id="lt"><span>דיוק</span><i></i></div>
<div class="btns" id="shR"><button class="b sh" data-bit="5">כתף ימין</button></div>
<div class="btns" id="faces">
  <button class="b" data-bit="3">Y</button><button class="b" data-bit="2">X</button>
  <button class="b" data-bit="1">B</button><button class="b" data-bit="0">A</button>
  <button class="b" id="fire" data-rt="1">ירי</button>
</div>
<div id="set">
  <label>אזור מת <input type="range" id="oDead" min="0" max="0.4" step="0.01" value="0.08"></label>
  <label>רדיוס הסטיק <input type="range" id="oRad" min="40" max="110" step="1" value="70"></label>
  <label>רטט <input type="checkbox" id="oVib" checked></label>
  <label>נסיעה בצד ימין (שמאליים) <input type="checkbox" id="oSwap"></label>
  <label>היפוך ציר קדימה <input type="checkbox" id="oInv"></label>
  <label>התחל <button class="b sh" data-bit="9" style="width:120px">Start</button></label>
  <label>חזור <button class="b sh" data-bit="8" style="width:120px">Back</button></label>
</div>
<div id="rot">סובב את הטלפון לרוחב</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const S={a:[0,0,0,0],b:0,lt:0,rt:0};
const O={dead:0.08,rad:70,vib:true,swap:false,inv:false};
try{ Object.assign(O,JSON.parse(localStorage.getItem("bbPadOpts")||"{}")); }catch(e){}
const saveO=()=>{ try{ localStorage.setItem("bbPadOpts",JSON.stringify(O)); }catch(e){} };
$("oDead").value=O.dead; $("oRad").value=O.rad; $("oVib").checked=O.vib; $("oSwap").checked=O.swap; $("oInv").checked=O.inv;
$("oDead").oninput=e=>{O.dead=+e.target.value;saveO();};
$("oRad").oninput=e=>{O.rad=+e.target.value;saveO();};
$("oVib").onchange=e=>{O.vib=e.target.checked;saveO();};
$("oSwap").onchange=e=>{O.swap=e.target.checked;saveO();};
$("oInv").onchange=e=>{O.inv=e.target.checked;saveO();};
$("gear").onclick=()=>$("set").classList.toggle("on");

let ws=null, last="", beat=0;
function send(o){ if(ws&&ws.readyState===1) ws.send(JSON.stringify(o)); }
function push(force){
  const m={t:"s",a:S.a.map(v=>+v.toFixed(3)),b:S.b,lt:+S.lt.toFixed(3),rt:S.rt};
  const s=JSON.stringify(m);
  if(force||s!==last){ last=s; if(ws&&ws.readyState===1) ws.send(s); }
}
function connect(){
  ws=new WebSocket("ws://"+location.host+"/ws?role=pad");
  ws.onopen=()=>{ $("led").classList.add("ok"); $("stx").textContent="מחובר"; push(true); };
  ws.onclose=()=>{ $("led").classList.remove("ok"); $("stx").textContent="מנותק — מתחבר שוב"; setTimeout(connect,1200); };
  ws.onmessage=e=>{ let m; try{ m=JSON.parse(e.data); }catch(x){ return; }
    if(m.t==="r"){ if(O.vib&&navigator.vibrate) navigator.vibrate(Math.max(10,Math.min(400,m.ms|0))); }
    else if(m.t==="q"){ send({t:"qr",c:m.c}); }
    else if(m.t==="ui"){ $("cMag").textContent="מחסנית "+(m.mag|0); $("cIn").classList.toggle("on",!!m.intake);
      $("cFc").textContent=m.fc?"ציר מגרש":"ציר רובוט"; $("cFc").classList.toggle("on",!!m.fc); }
    else if(m.t==="sim"){ $("stx").textContent=m.on?"הסימולטור מחובר":"מחכה לסימולטור"; }
  };
}
connect();
setInterval(()=>{ push(true); },200);          /* פעימה חמש פעמים בשנייה — שקט פירושו עצירה */

/* סטיקים צפים: הנגיעה היא המרכז */
function stick(zone,el,apply){
  let id=null, cx=0, cy=0; const knob=el.querySelector("i");
  const set=(x,y)=>{ const r=O.rad, d=Math.hypot(x,y), k=d>r?r/d:1; x*=k; y*=k;
    knob.style.transform="translate("+x+"px,"+y+"px)";
    let nx=x/r, ny=y/r; const m=Math.hypot(nx,ny);
    if(m<O.dead){ nx=0; ny=0; } else { const s=(m-O.dead)/(1-O.dead)/m; nx*=s; ny*=s; }  /* אזור מת רדיאלי */
    apply(nx,ny); push(); };
  zone.addEventListener("pointerdown",e=>{ if(id!==null) return; id=e.pointerId; zone.setPointerCapture(id);
    cx=e.clientX; cy=e.clientY; el.style.display="block"; el.style.left=cx+"px"; el.style.top=cy+"px";
    const r=zone.getBoundingClientRect(); el.style.left=(cx-r.left)+"px"; el.style.top=(cy-r.top)+"px"; set(0,0); });
  zone.addEventListener("pointermove",e=>{ if(e.pointerId!==id) return; set(e.clientX-cx,e.clientY-cy); });
  const end=e=>{ if(e.pointerId!==id) return; id=null; el.style.display="none"; knob.style.transform=""; apply(0,0); push(); };
  zone.addEventListener("pointerup",end); zone.addEventListener("pointercancel",end);
}
const drive=(x,y)=>{ S.a[0]=x; S.a[1]=O.inv?-y:y; };
const turn=(x,y)=>{ S.a[2]=x; S.a[3]=y; };
stick($("zL"),$("sL"),(x,y)=>O.swap?turn(x,y):drive(x,y));
stick($("zR"),$("sR"),(x,y)=>O.swap?drive(x,y):turn(x,y));

document.querySelectorAll(".b").forEach(b=>{
  const on=v=>{ b.classList.toggle("dn",v);
    if(b.dataset.rt) S.rt=v?1:0; else { const bit=1<<(+b.dataset.bit); S.b=v?(S.b|bit):(S.b&~bit); }
    push(); };
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); e.stopPropagation(); b.setPointerCapture(e.pointerId); on(true); });
  b.addEventListener("pointerup",()=>on(false)); b.addEventListener("pointercancel",()=>on(false));
});
/* הדק שמאלי אנלוגי: גובה הנגיעה הוא עומק הלחיצה */
(function(){ const el=$("lt"), bar=el.querySelector("i"); let id=null;
  const set=e=>{ const r=el.getBoundingClientRect(); const v=Math.max(0,Math.min(1,(r.bottom-e.clientY)/r.height));
    S.lt=v; bar.style.height=(v*100)+"%"; push(); };
  el.addEventListener("pointerdown",e=>{ e.stopPropagation(); id=e.pointerId; el.setPointerCapture(id); set(e); });
  el.addEventListener("pointermove",e=>{ if(e.pointerId===id) set(e); });
  const end=()=>{ id=null; S.lt=0; bar.style.height="0"; push(); };
  el.addEventListener("pointerup",end); el.addEventListener("pointercancel",end); })();
/* מסך דולק ומסך מלא */
let lock=null; const wake=()=>{ try{ if(navigator.wakeLock) navigator.wakeLock.request("screen").then(l=>lock=l).catch(()=>{}); }catch(e){} };
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) wake(); });
document.addEventListener("pointerdown",()=>{ wake();
  try{ if(!document.fullscreenElement&&document.documentElement.requestFullscreen)
    document.documentElement.requestFullscreen().then(()=>{ try{ screen.orientation.lock("landscape"); }catch(e){} }).catch(()=>{}); }catch(e){} },{once:true});
})();
</script>
</body></html>
